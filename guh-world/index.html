<main id="gameWrap">
 <header id="topbar"><div class="brand"><div><b>GUH WORLD</b><small>UNEMPLOYMENT · ARCADE</small></div></div><span class="tag"><span class="liveDot"></span> ONE LIFE</span></header>
 <div id="stage"><canvas id="game" width="480" height="640" aria-label="GUH WORLD game"></canvas>
  <div id="hud"><div class="score"><small>DISTANCE</small><strong id="distance">0m</strong><small id="best">BEST 0m</small></div><div class="stats"><span class="stat crewStat"><span class="statLabel">DROOL CREW</span><b id="cats">0</b></span><span class="stat roseStat"><span class="roseMark" aria-hidden="true"></span><b id="roses">0</b></span></div></div>
  <div id="power" aria-label="Dash status"><span class="dropletMark"></span><span id="powerLabel">DASH</span><span class="powerTrack"><span id="powerFill"></span></span></div><button id="mute" type="button" aria-label="Toggle sound">SFX</button>
  
  <div id="controls"><button class="control" id="jump" type="button" aria-label="Jump"><span class="controlLetter">A</span><span class="controlText">JUMP</span></button><button class="control" id="dash" type="button" aria-label="Dash"><span class="controlLetter">B</span><span class="controlText">DASH</span></button></div><div id="overlay"><section id="panel"><span class="eyebrow">THE DROOL IS ETERNAL</span><h1>GUH WORLD</h1><h2>UNEMPLOYMENT <span class="roseAccent" aria-hidden="true"></span></h2><p>RUN FROM RESPONSIBILITY.<br>RESCUE THE CATS. NEVER CLOCK IN.</p><button id="start" type="button">START RUN →</button><small>ONE LIFE · A TO JUMP · B TO DASH</small></section></div>
 </div>
</main>
<script>
'use strict';
const canvas=document.getElementById('game'),g=canvas.getContext('2d');
g.imageSmoothingEnabled=false;
const W=480,H=640,START_Y=430,GRAVITY=.56,JUMP=-12.9,BASE_SPEED=3.8;
const el=id=>document.getElementById(id);
const rect=(x,y,w,h)=>g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
let state='menu',frame=0,cam=0,worldEnd=0,platforms=[],roses=[],cats=[],drops=[],particles=[],p=null;
let generated=0,nextPowerAt=24,best=0,bestCats=0,sound=true,audio=null,seed=1,last=0,acc=0,noticeEnd=0;
const keys={jump:false,dash:false};let jumpPrev=false,dashPrev=false;
function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function range(a,b){return a+(b-a)*rand()}
function notice(s){} // Collectibles update the HUD silently.
function tone(freq=500,duration=.09){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),vol=audio.createGain();osc.frequency.value=freq;vol.gain.setValueAtTime(.047,audio.currentTime);vol.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);osc.connect(vol);vol.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
function unlockSound(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function save(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function load(k){try{return Number(localStorage.getItem(k))||0}catch(e){return 0}}
best=load('guh_unemployment_v2_best');bestCats=load('guh_unemployment_v2_cats');
function start(){
 unlockSound();
 state='play';frame=0;cam=0;worldEnd=0;seed=Date.now()>>>0;
 platforms=[];roses=[];cats=[];drops=[];particles=[];generated=0;nextPowerAt=24+Math.floor(rand()*7);
 p={x:85,y:START_Y-55,w:39,h:55,vy:0,grounded:true,coyote:8,jumpBuffer:0,jumpAge:0,dash:0,cooldown:0,power:0,followers:0,roses:0,trail:[],distance:0};
 platforms.push({x:0,y:START_Y,w:240,h:22});worldEnd=240;
 // The first landing is reachable with a normal jump; every later landing follows the same rule.
 for(let i=0;i<12;i++)generate();
 keys.jump=false;keys.dash=false;jumpPrev=false;dashPrev=false;
 el('overlay').style.display='none';updateHud();
}
function generate(){
 const n=++generated,hard=Math.min(1,Math.max(0,(worldEnd-1500)/18000));
 const prev=platforms[platforms.length-1];
 // Jump travels ~150-210px at the current running speed; these gaps stay inside that envelope.
 // Variety comes from platform length and gentle climbs/descents, not impossible gaps.
 // Preserve the previous maximum gap and normal jump physics.
 const gap=Math.round(range(45,70)+hard*9);
 const phase=Math.floor(n/5)%4;
 const rise=phase===0?-1:phase===2?1:0;
 const dy=Math.round(range(-15,16)+rise*8);
 const y=Math.max(315,Math.min(500,prev.y+dy));
 // Three compact sizes. Tiny platforms are introduced gradually.
 // Keep the original jump and dash physics; never require a power-up to cross.
 const type=rand();
 const tinyChance=hard*.10;
 const shortChance=.25;
 const width=Math.round(type<tinyChance?range(55,86):
                        type<tinyChance+shortChance?range(90,136):
                        range(140,186));
 const x=prev.x+prev.w+gap;
 const next={x,y,w:width,h:22};platforms.push(next);
 if(n>=nextPowerAt){drops.push({x:x+width*.35,y:y-52,got:false});nextPowerAt=n+20+Math.floor(rand()*11)}
 else if(n>1&&n%7===0)roses.push({x:x+width*.62,y:y-64,got:false});
 else if(n>1&&n%2===0)cats.push({x:x+Math.min(85,width*.45),y:y-43,got:false});
 worldEnd=x+width;
}
function updateHud(){
 el('distance').textContent=Math.floor(p.distance/10)+'m';
 el('best').textContent='BEST '+best+'m';
 el('cats').textContent=p.followers;el('roses').textContent=p.roses||0;
 el('powerLabel').textContent=p.power>0?'DROOLMAXX':p.cooldown>0?'RECHARGE':'DASH';
 el('powerFill').style.width=(p.power>0?100:Math.max(0,100*(1-p.cooldown/85)))+'%';
}
function end(){
 if(state!=='play')return;state='dead';tone(165,.22);
 const d=Math.floor(p.distance/10);best=Math.max(best,d);bestCats=Math.max(bestCats,p.followers);
 save('guh_unemployment_v2_best',best);save('guh_unemployment_v2_cats',bestCats);
 el('overlay').style.display='grid';
 el('panel').innerHTML='<h1>YOU GOT EMPLOYED.</h1><h2>'+d+'m SURVIVED</h2><p>BEST '+best+'m · DROOL CREW '+p.followers+' (RECORD '+bestCats+') · ROSES '+(p.roses||0)+'</p><button id="again" type="button">TRY AGAIN</button><small>one life. no job.</small>';
 el('again').onclick=start;
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){
 if(state!=='play')return;frame++;

 if(p.cooldown>0)p.cooldown--;if(p.power>0)p.power--;
 const speed=BASE_SPEED+Math.min(3.0,p.distance/11500)+(p.power>0?.45:0);
 if(keys.jump&&!jumpPrev)p.jumpBuffer=10;
 if(keys.dash&&!dashPrev&&p.cooldown===0){
   const boosted=p.power>0;
   p.dash=boosted?20:14;
   p.dashStrength=boosted?7:4.7;
   p.cooldown=boosted?38:85;
   tone(boosted?750:620,.085);
 }
 jumpPrev=keys.jump;dashPrev=keys.dash;
 if(p.grounded)p.coyote=8;else p.coyote=Math.max(0,p.coyote-1);
 if(p.jumpBuffer>0)p.jumpBuffer--;
 if(p.jumpBuffer>0&&p.coyote>0){p.vy=JUMP;p.grounded=false;p.coyote=0;p.jumpBuffer=0;p.jumpAge=0;tone(530,.08)}
 if(!p.grounded)p.jumpAge++;
 // A quick touch must still give a proper jump before variable-height cut applies.
 if(!keys.jump&&p.jumpAge>12&&p.vy<-5)p.vy*=.92;
 p.vy=Math.min(15,p.vy+GRAVITY);
 const oldBottom=p.y+p.h;
 const oldX=p.x;
 const dx=speed+(p.dash>0?p.dashStrength:0);
 if(p.dash>0)p.dash--;
 p.x+=dx;p.y+=p.vy;p.grounded=false;
 if(p.vy>=0){
  for(const b of platforms){if(p.x+p.w>b.x+3&&oldX<b.x+b.w-3&&oldBottom<=b.y+5&&p.y+p.h>=b.y){p.y=b.y-p.h;p.vy=0;p.grounded=true;break}}
 }
 if(p.y>H+80){end();return}
 p.distance=Math.max(p.distance,p.x-85);
 while(worldEnd<p.x+1700)generate();
 const target=Math.max(0,p.x-135);cam+=(target-cam)*.12;
 // Only discard a platform when its RIGHT edge is far outside the visible viewport.
 const safeLeft=cam-650;
 platforms=platforms.filter(b=>b.x+b.w>=safeLeft);
 roses=roses.filter(a=>!a.got&&a.x>=safeLeft);
 cats=cats.filter(a=>!a.got&&a.x>=safeLeft);
 drops=drops.filter(a=>!a.got&&a.x>=safeLeft);
 for(const a of cats)if(Math.abs(p.x+20-a.x)<35&&Math.abs(p.y+25-a.y)<47){a.got=true;p.followers++;notice('CAT RESCUED '+p.followers);tone(670,.13)}
 for(const a of roses)if(Math.abs(p.x+20-a.x)<35&&Math.abs(p.y+25-a.y)<46){a.got=true;p.roses=(p.roses||0)+1;notice('ROSE COLLECTED');tone(860,.13)}
 for(const a of drops)if(Math.abs(p.x+20-a.x)<37&&Math.abs(p.y+25-a.y)<46){a.got=true;p.power=240;notice('DROOLMAXXING');tone(980,.17)}
 p.trail.unshift({x:p.x,y:p.y});
 if(p.trail.length>740)p.trail.pop();
 updateHud();
}
function pixelCat(x,y,scale=1,flip=1,phase=0,ghost=false){

 if(ghost)g.globalAlpha=.72;
 const b=(x,y,w,h,c)=>{g.fillStyle=c;rect(x,y,w,h)};
 // Character follows the supplied voxel tabby: oversized cubic head,

 const step=phase%18<9?2:-2;
 // tail and small body
 b(-18,24,16,12,'#646c74');b(-23,32,17,7,'#858d94');
 b(-9,15,39,23,'#717b84');b(-4,19,34,19,'#89939a');
 b(2,21,13,15,'#555e67');b(22,20,8,12,'#59636c');
 b(10,26,13,14,'#dce1df');
 b(0,36+step,13,7,'#dfe5e4');b(21,36-step,13,7,'#ced6d7');
 // large cubic tabby head with stepped pixel silhouette
 b(-14,-21,51,47,'#626b74');b(-10,-27,44,53,'#818a91');
 b(-7,-31,38,55,'#a3aaae');b(-16,-10,56,32,'#8b949a');
 b(-13,-26,49,16,'#8c959b');
 // block ears / pink inside

 b(21,-39,18,25,'#667179');b(23,-34,12,20,'#b4bbbd');b(27,-29,7,13,'#e4c4c4');
 // characteristic tabby streaks and dark side stripes
 b(-12,-7,9,17,'#59636d');b(-12,12,15,5,'#646e76');
 b(-2,-26,13,4,'#606a73');b(16,-27,13,5,'#66717a');
 b(1,-20,6,8,'#727c84');b(24,-19,6,5,'#727c84');
 // white face stripe / muzzle

 b(-4,9,43,15,'#d3dbdb');b(6,14,29,9,'#f0eeea');
 // big glossy original black eyes
 b(-8,-12,16,19,'#1b2026');b(-5,-14,13,18,'#080d16');
 b(22,-12,16,19,'#1b2026');b(23,-14,13,18,'#080d16');
 b(-3,-10,5,6,'#ffffff');b(25,-10,5,6,'#ffffff');
 b(5,-4,2,2,'#77838b');b(34,-4,2,2,'#6c7883');
 // pink button nose and long blue dripping drool
 b(15,10,11,6,'#efd4c9');b(17,9,7,5,'#f2c3b9');
 b(20,16,5,15,'#4b9ed1');b(19,27,8,11,'#71c7ef');b(20,35,7,5,'#8be1f8');
 b(22,21,2,12,'#c7f7ff');
 g.restore();
}

function drawRose(x,y){
  if(!ROSE_SPRITE.complete) return;
  g.save();
  g.imageSmoothingEnabled=false;
  g.drawImage(ROSE_SPRITE, Math.round(x-16), Math.round(y-34), 32, 34);
  g.restore();

function drawDrop(x,y){g.save();g.translate(Math.round(x),Math.round(y));g.fillStyle='#237ba8';g.beginPath();g.moveTo(0,-20);g.bezierCurveTo(16,2,16,18,0,20);g.bezierCurveTo(-16,18,-16,2,0,-20);g.fill();g.fillStyle='#68d9f8';g.beginPath();g.moveTo(-2,-14);g.bezierCurveTo(9,3,11,13,0,16);g.bezierCurveTo(-11,13,-9,3,-2,-14);g.fill();g.fillStyle='#e4fbff';rect(-5,1,4,8);g.restore()}
const skies=[['#80c4ec','#d1effa','#738fb6'],['#b9b4df','#f4d6e6','#7d84b3'],['#edb18c','#ffe2ad','#a17b9d'],['#4c689b','#a2a7ce','#3e527e']];
function background(){
 const index=Math.floor((p?p.distance:0)/5000)%skies.length,t=skies[index];
 g.fillStyle=t[0];rect(0,0,W,H);
 g.fillStyle=t[1];rect(0,530,W,110);
 g.fillStyle=index===3?'#e8e8ff':'#ffe6b1';g.beginPath();g.arc(402,120,30,0,Math.PI*2);g.fill();
 for(let i=0;i<11;i++){
  const x=((i*153-cam*.16)%1700+1700)%1700-180,y=90+(i*61)%290;
  g.fillStyle='#f1f5fa';rect(x,y,85,17);rect(x+17,y-13,54,18);
 }
 for(let i=0;i<12;i++){
  const x=((i*155-cam*.32)%2000+2000)%2000-170,h=45+(i*23)%85;
  g.fillStyle=t[2];rect(x,530-h,85,h);g.fillStyle='#d9e4e9';
  for(let k=0;k<3;k++)rect(x+12+k*22,540-h,9,12);
 }
 // Void starts below the floating course; there is no solid floor.
 g.fillStyle='#253550';rect(0,592,W,48);
}
function draw(){
 background();if(!p)return;
 g.save();g.translate(-Math.round(cam),0);
 for(const b of platforms){if(b.x+b.w<cam-50||b.x>cam+W+50)continue;
  g.fillStyle='#4b4868';rect(b.x+2,b.y+7,b.w-4,21);
  g.fillStyle='#725f82';rect(b.x,b.y+9,b.w,14);
  g.fillStyle='#9ee0a5';rect(b.x,b.y,b.w,7);
  g.fillStyle='#4b9b78';rect(b.x,b.y+7,b.w,6);
  g.fillStyle='#d2f2c1';rect(b.x+8,b.y+2,Math.max(8,b.w-26),2);
  g.fillStyle='#544c72';rect(b.x+12,b.y+23,13,7);rect(b.x+b.w-26,b.y+23,13,7);
 }
 for(const a of roses)drawRose(a.x,a.y);
 for(const a of drops)drawDrop(a.x,a.y);
 for(const a of cats)pixelCat(a.x,a.y,.66,1,frame/5,true);
 // Followers are visualized from recent player positions, capped for smooth mobile rendering.
 // Total rescues remain unlimited and are recorded in the HUD.
 const visible=Math.min(p.followers,34);
 for(let k=visible;k>=1;k--){
  const q=p.trail[Math.min(p.trail.length-1,k*12)];
  if(q&&q.x>cam-70&&q.x<cam+W+60)pixelCat(q.x+18,q.y+18,.59,1,frame/6,true);
 }
 if(p.dash>0&&p.power>0){
  g.save();g.globalAlpha=.6;
  for(let i=1;i<=5;i++){
   g.fillStyle=i%2?'#62dfff':'#c6f7ff';
   rect(p.x-i*15,p.y+13+(i%3)*10,19,5);
  }
  g.restore();
 }
 pixelCat(p.x+17,p.y+18,1,1,frame/5);
 g.restore();

}
const keyMap={Space:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'dash',ShiftRight:'dash',KeyX:'dash'};
window.addEventListener('keydown',e=>{if(keyMap[e.code]){keyboardHeld[keyMap[e.code]]=true;sync();e.preventDefault()}if(e.code==='Enter'&&state!=='play')start()});
window.addEventListener('keyup',e=>{if(keyMap[e.code]){keyboardHeld[keyMap[e.code]]=false;sync();e.preventDefault()}});
const pointers=new Map();
const touchHeld={jump:false,dash:false};
function sync(){
 const pressed=new Set(pointers.values());
 for(const k of ['jump','dash']){
  touchHeld[k]=pressed.has(k);
  keys[k]=touchHeld[k]||!!keyboardHeld[k];
  el(k).classList.toggle('down',touchHeld[k]);
 }
}
const keyboardHeld={jump:false,dash:false};
// Each finger has its own pointer ID. Holding jump does not block dash (or vice versa).
for(const k of ['jump','dash']){
 const b=el(k);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  unlockSound();
  try{b.setPointerCapture(e.pointerId)}catch(_){}
  pointers.set(e.pointerId,k);
  if(k==='jump'&&state==='play')p.jumpBuffer=10; // queue at touch-down, not next key transition
  sync();
 },{passive:false});
 const release=e=>{if(pointers.has(e.pointerId)){pointers.delete(e.pointerId);sync()}e.preventDefault()};
 b.addEventListener('pointerup',release,{passive:false});
 b.addEventListener('pointercancel',release,{passive:false});
 b.addEventListener('lostpointercapture',release);
 b.addEventListener('contextmenu',e=>e.preventDefault());
}
window.addEventListener('blur',()=>{pointers.clear();for(const k in keyboardHeld)keyboardHeld[k]=false;sync()});
el('start').onclick=start;
el('mute').onclick=()=>{sound=!sound;el('mute').textContent=sound?'SFX':'OFF'};
p={distance:0,followers:0,roses:0,power:0,trail:[]};
function loop(now){if(!last)last=now;acc+=Math.min(80,now-last);last=now;let steps=0;while(acc>=1000/60&&steps++<4){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
